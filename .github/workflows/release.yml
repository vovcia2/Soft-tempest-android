name: Release

# Every push to main becomes a semantic-version release:
#   1. the next version is computed from conventional commits since the last tag
#      (fix: -> patch, feat: -> minor, "BREAKING CHANGE"/"!" -> major, anything else -> patch),
#   2. the tag vX.Y.Z is created,
#   3. the release APK is built with that version baked in,
#   4. a GitHub Release is published with the APK attached.
# Manual runs can force the bump level. Commits whose message contains "[skip ci]" are not built.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [ auto, patch, minor, major ]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: First release starts at 0.1.0
        id: first
        run: |
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            echo "custom_tag=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: main
          default_bump: ${{ (github.event_name == 'workflow_dispatch' && inputs.bump != 'auto') && inputs.bump || 'patch' }}
          custom_tag: ${{ steps.first.outputs.custom_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: release APK is signed with a throw-away debug key. Updates over a previous install will fail; see README."
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -PversionName=${{ steps.tag.outputs.new_version }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: softtempest-${{ steps.tag.outputs.new_version }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: |
            ${{ steps.tag.outputs.changelog }}

            ${{ steps.keystore.outputs.signed == 'true' && 'APK signed with the project release key.' || '> **Unsigned build**: this APK is signed with a throw-away debug key. Uninstall the previous version before installing, or configure the signing secrets (see README).' }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
