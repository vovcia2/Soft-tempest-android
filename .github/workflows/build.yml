name: Build APK

on:
  push:
    branches-ignore: [ main ]   # main is built and released by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-describe versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compute version
        id: version
        run: echo "name=$(./gradlew -q printVersionName --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: softtempest-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
